# =============================================================================
#  Workflow execution bindings
# =============================================================================
#  The Excel file (workflows/AI_Agent_Workflow_Assessment.xlsx) defines WHAT each
#  workflow is: name, trigger, inputs, ordered steps, decision logic, tools and
#  expected output. This file defines HOW each Excel step is executed.
#
#  For every workflow:
#    params:    what the agent extracts from the user's request. These become the
#               JSON-schema of the LLM tool for this workflow. `pattern`/`keywords`
#               drive the offline (no-LLM) extractor.
#    settings:  thresholds and constants (decision-logic values live HERE, not in code)
#    steps:     one entry per Excel step, IN THE SAME ORDER. The step label shown to
#               the user is taken from the Excel file. Each step names a registered
#               tool and its args. Args may reference:
#                  $params.<name>   value extracted from the request
#                  $settings.<name> value from `settings`
#                  $data.<key>      output of an earlier step (`output: <key>`)
#               Optional per step: retries, on_error (fail|continue), when (condition)
#    report:    declarative final result (args of the generic `build_report` tool)
#
#  The registry validates at start-up that every Excel step has a binding and
#  every tool exists (`python -m agent validate`).
# =============================================================================

workflows:

  # ---------------------------------------------------------------------------
  WF001:
    keywords: [restock, reorder, low stock, inventory, replenish, out of stock]
    params:
      inventory_path:
        description: Path to the inventory CSV (defaults to today's inventory export)
        default: data/inventory.csv
        llm: false
      threshold_override:
        type: integer
        description: A single minimum-stock threshold the user explicitly asked for (e.g. "below 20 units"). Omit to use each product's own minimum_stock.
        pattern: '(?:below|under|less than|threshold(?: of)?)\s+(\d+)'
    settings:
      target_multiplier: 2        # reorder up to 2x the minimum threshold
    steps:
      - tool: load_table                                     # Load inventory
        args: {path: $params.inventory_path, required_columns: [sku, product_name, current_stock, minimum_stock]}
        output: inventory
      - tool: compute_columns                                # Compare current stock with minimum threshold
        args:
          rows: $data.inventory
          variables: {threshold_override: $params.threshold_override}
          columns:
            threshold: coalesce(threshold_override, minimum_stock)
            shortfall: threshold - current_stock
          explain: "threshold = user override if given, else product minimum_stock; shortfall = threshold - current_stock"
        output: compared
      - tool: filter_rows                                    # Identify low-stock products
        args: {rows: $data.compared, condition: current_stock < threshold, label: products}
        output: low_stock
      - tool: compute_columns                                # Calculate reorder quantity
        args:
          rows: $data.low_stock
          variables: {target_multiplier: $settings.target_multiplier}
          columns:
            target_stock: threshold * target_multiplier
            suggested_reorder_qty: ceil_to(target_stock - current_stock, coalesce(case_pack, 1))
          explain: "reorder qty = (threshold x 2) - current stock, rounded up to the supplier case pack"
        output: restock
      - tool: filter_rows                                    # Generate restock list (sanity: only positive orders)
        args: {rows: $data.restock, condition: suggested_reorder_qty > 0, label: restock lines}
        output: restock_list
    report:
      title: Restock list
      vars: {restock: $data.restock_list, inventory: $data.inventory}
      computed: {n: len(restock), total: len(inventory)}
      summary: "{n} of {total} products are below their minimum stock threshold and need restocking."
      metrics: {Products checked: total, Products to restock: n}
      tables:
        - title: Products requiring restock
          rows: $data.restock_list
          sort_by: shortfall
          descending: true
          columns: [sku, product_name, current_stock, threshold, shortfall, suggested_reorder_qty, supplier]
          empty_message: All products are at or above their minimum stock.
      exports:
        - {rows: $data.restock_list, path: outputs/files/restock_list.csv,
           columns: [sku, product_name, current_stock, threshold, suggested_reorder_qty, supplier]}
      notes: ["Rule: current_stock < minimum_stock (a product exactly AT its minimum is not flagged)."]

  # ---------------------------------------------------------------------------
  WF002:
    keywords: [price, pricing, vendor price, validate, mismatch, differ, difference]
    params:
      tolerance_pct:
        type: number
        description: Percentage difference above which a price is an exception, only if the user states one (default 10)
        pattern: '(\d+(?:\.\d+)?)\s*%'
    settings:
      default_tolerance_pct: 10
    steps:
      - tool: load_tables                                    # Load product prices
        args: {sources: {internal: data/products.csv, vendor: data/vendor_prices.csv}}
        output: prices
      - tool: join_tables                                    # Match products by SKU
        args: {left: $data.prices.internal, right: $data.prices.vendor, left_key: sku, right_key: vendor_sku}
        output: joined
      - tool: compute_columns                                # Compare internal and vendor prices
        args:
          rows: $data.joined.matched
          columns: {price_difference: "round(price - vendor_price, 2)"}
        output: compared
      - tool: compute_columns                                # Calculate percentage difference
        args:
          rows: $data.compared
          columns: {pct_difference: "pct_diff(price, vendor_price)"}
          explain: "pct_difference = (internal - vendor) / vendor x 100"
        output: with_pct
      - tool: compute_columns                                # Flag exceptions
        args:
          rows: $data.with_pct
          variables: {tolerance: $params.tolerance_pct, default_tol: $settings.default_tolerance_pct}
          columns:
            tolerance_used: coalesce(tolerance, default_tol)
            is_exception: abs(pct_difference) > tolerance_used
            flag: "'NO VENDOR PRICE' if pct_difference == None else ('EXCEPTION' if is_exception else 'ok')"
          explain: "Rule: |pct_difference| > tolerance (10% by default) -> exception"
        output: validated
    report:
      title: Price validation report
      vars: {rows: $data.validated, left_only: $data.joined.left_only, right_only: $data.joined.right_only,
             tol: $params.tolerance_pct, default_tol: $settings.default_tolerance_pct}
      computed:
        matched: len(rows)
        tolerance: coalesce(tol, default_tol)
      summary: "{matched} products matched by SKU; exceptions are price differences above {tolerance}%."
      metrics: {Products matched: matched, Tolerance %: tolerance, Unmatched internal SKUs: len(left_only), Vendor-only SKUs: len(right_only)}
      tables:
        - title: Exceptions (difference exceeds tolerance)
          rows: $data.validated
          where: is_exception
          sort_by: pct_difference
          descending: true
          columns: [sku, product_name, price, vendor_price, price_difference, pct_difference]
          headers: [SKU, Product, Internal $, Vendor $, Diff $, Diff %]
          empty_message: No exceptions.
        - title: All matched products
          rows: $data.validated
          columns: [sku, product_name, price, vendor_price, pct_difference, flag]
        - title: Not matched (internal SKU missing from vendor list)
          rows: $data.joined.left_only
          columns: [sku, product_name, price]
          hide_if_empty: true
        - title: Not matched (vendor SKU not in internal catalogue)
          rows: $data.joined.right_only
          columns: [vendor_sku, vendor_price]
          hide_if_empty: true
      exports:
        - {rows: $data.validated, path: outputs/files/price_validation.csv,
           columns: [sku, product_name, price, vendor_price, price_difference, pct_difference, flag]}

  # ---------------------------------------------------------------------------
  WF003:
    keywords: [vendor file, spreadsheet, clean, invalid rows, process file, upload, columns]
    params:
      file_path:
        description: Path of the vendor CSV/XLSX file to process (the attached file)
        llm: false
        pattern: '([\w./\\-]+\.(?:xlsx|csv))'
    settings:
      aliases:
        sku: [item code, item_code, vendor sku, product code, code, article number, sku code]
        product_name: [product title, name, title, item name, product, description]
        price: [unit price, unit price $, cost, price usd, unit cost]
        quantity: [qty, qty available, stock, quantity available, inventory]
        color: [colour, color name]
        category: [product category, type]
    steps:
      - tool: load_table                                     # Read file
        args: {path: $params.file_path, raw: true,
               ask_if_missing: "Please attach the vendor file (CSV or XLSX) you want me to process."}
        output: raw_rows
      - tool: detect_columns                                 # Detect columns
        args: {rows: $data.raw_rows, aliases: $settings.aliases, required: [sku, product_name]}
        output: detection
      - tool: normalize_columns                              # Normalize column names
        args: {rows: $data.raw_rows, detection: $data.detection, uppercase: [sku]}
        output: normalized
      - tool: annotate_errors                                # Validate required fields
        args:
          rows: $data.normalized
          rules:
            - {valid_if: "not is_blank(sku)", message: Missing SKU}
            - {valid_if: "not is_blank(product_name)", message: Missing product name}
        output: validated
      - tool: partition_rows                                 # Identify invalid rows
        args: {rows: $data.validated, condition: len(_errors) > 0, matched_label: invalid, unmatched_label: valid}
        output: split
      - tool: export_table                                   # Produce cleaned dataset
        args: {rows: $data.split.valid, path: outputs/files/cleaned.csv, prefix_from: $params.file_path,
               columns: [sku, product_name, price, quantity, color, category]}
        output: cleaned_file
    report:
      title: Vendor file processing
      vars: {valid: $data.split.valid, invalid: $data.split.invalid, file: $params.file_path, mapping: $data.detection.mapping}
      computed: {n_valid: len(valid), n_invalid: len(invalid), n_total: len(valid) + len(invalid)}
      summary: "{n_total} rows read from {file}: {n_valid} valid, {n_invalid} invalid (missing SKU or product name)."
      metrics: {Rows read: n_total, Valid rows: n_valid, Invalid rows: n_invalid}
      sections:
        - {title: Column mapping detected, content: $data.detection.mapping}
      tables:
        - title: Invalid rows
          rows: $data.split.invalid
          columns: [_row, sku, product_name, price, _errors]
          headers: [Source row, SKU, Product name, Price, Errors]
          empty_message: No invalid rows.
        - title: Cleaned dataset
          rows: $data.split.valid
          columns: [sku, product_name, price, quantity, color, category]
      exports:
        - {rows: $data.split.invalid, path: outputs/files/invalid_rows.csv, prefix_from: $params.file_path,
           columns: [_row, sku, product_name, price, _errors]}
      extra_files: [$data.cleaned_file]
      notes: ["Per the decision logic only a missing SKU or product name makes a row invalid; other issues (e.g. non-numeric price) are kept."]

  # ---------------------------------------------------------------------------
  WF004:
    keywords: [seo, product description, content, copy, meta description, seo title, write]
    params:
      # Offline patterns expect "field: value" pairs separated by ';' or new lines, e.g.
      #   name: Silk Scarf; category: Accessories; colour: emerald; features: hand-rolled edges, 90x90 cm
      product_name: {description: "Product name exactly as given by the user", pattern: '\b(?:product name|name)\s*[:=]\s*([^;\n]+)'}
      category: {description: "Product category exactly as given", pattern: '\bcategory\s*[:=]\s*([^;\n]+)'}
      attributes: {type: array, description: "Product features/attributes exactly as given (e.g. fit, pockets)", pattern: '\b(?:attributes|features)\s*[:=]\s*([^;\n]+)'}
      material: {description: "Material, only if stated", pattern: '\bmaterial\s*[:=]\s*([^;\n]+)'}
      color: {description: "Colour, only if stated", pattern: '\b(?:colou?r)\s*[:=]\s*([^;\n]+)'}
      target_audience: {description: "Target audience, only if stated", pattern: '\b(?:target audience|audience)\s*[:=]\s*([^;\n]+)'}
    settings:
      fields: [product_name, category, attributes, material, color, target_audience]
    steps:
      - tool: validate_params                                # Validate required attributes
        args:
          required: [product_name, category]
          soft: [attributes, material, color, target_audience]
          question: "Please share at least the product name and category (plus material, colour, attributes and target audience if available) - I won't invent missing details."
        output: validation
      - tool: llm_generate                                   # Create product description
        args:
          task: Write a product description (2-4 sentences)
          inputs: {product: $params, missing_fields: $data.validation.missing_soft}
          fields: {description: {description: "Product description using only provided facts", max_chars: 700}}
          fallback: product_description
        output: description
      - tool: llm_generate                                   # Generate short description
        args:
          task: Write a one-sentence short description
          inputs: {product: $params, description: $data.description.description, missing_fields: $data.validation.missing_soft}
          fields: {short_description: {description: "One sentence", max_chars: 160}}
          fallback: product_short_description
        output: short
      - tool: llm_generate                                   # Generate SEO title
        args:
          task: Write an SEO page title with the primary keyword first
          inputs: {product: $params}
          fields: {seo_title: {description: "SEO title", max_chars: 60}}
          fallback: product_seo_title
        output: seo
      - tool: llm_generate                                   # Generate meta description
        args:
          task: Write an SEO meta description with a call to action
          inputs: {product: $params, missing_fields: $data.validation.missing_soft}
          fields: {meta_description: {description: "Meta description", max_chars: 160}}
          fallback: product_meta_description
        output: meta
    report:
      title: Product content
      vars: {missing: $data.validation.missing_soft, name: $params.product_name}
      summary: "Content generated for '{name}'."
      metrics: {Missing attributes: "len(missing)"}
      sections:
        - {title: Product description, content: $data.description.description}
        - {title: Short description, content: $data.short.short_description}
        - {title: SEO title, content: $data.seo.seo_title}
        - {title: Meta description, content: $data.meta.meta_description}
        - {title: "Missing information (marked, not invented)", content: $data.validation.missing_soft}

  # ---------------------------------------------------------------------------
  WF005:
    keywords: [order, where is, status, tracking, shipment, delivery, shipped]
    params:
      order_id:
        description: Order ID like ORD-1001, if given
        pattern: '\b(ORD-?\d{3,})\b'
      email:
        description: Customer email address, if given
        pattern: '([\w.+-]+@[\w-]+\.[\w.-]+)'
    steps:
      - tool: validate_identifier                            # Validate identifier
        args: {order_id: $params.order_id, email: $params.email}
        output: identifier
      - tool: order_lookup                                   # Search order data
        args: {identifier: $data.identifier}
        retries: 2                                           # transient API errors are retried
        output: orders
      - tool: extract_order_status                           # Retrieve order status
        args: {orders: $data.orders}
        output: statuses
      - tool: shipment_lookup                                # Retrieve shipment information
        args: {orders: $data.statuses}
        output: shipments
      - tool: summarize_order_status                         # Summarize current status
        args: {orders: $data.shipments}
        output: summary
    report:
      title: Order status
      vars: {orders: $data.shipments}
      summary: "{n} order(s) found."
      computed: {n: len(orders)}
      sections:
        - {title: Summary, content: $data.summary}
      tables:
        - title: Order details
          rows: $data.shipments
          columns: [order_id, order_date, status, items, total, carrier, tracking_number, shipment_status, estimated_delivery]

  # ---------------------------------------------------------------------------
  WF006:
    keywords: [duplicate, duplicates, dedupe, same product, catalog, catalogue]
    params:
      catalog_path: {description: "Product catalogue file", default: data/catalog.csv, llm: false}
    settings:
      weights: {name: 0.45, brand: 0.15, color: 0.15, size: 0.15, price: 0.10}
      min_name_similarity: 0.6
      possible_threshold: 0.85
      high_threshold: 0.95
      variant_attributes: [size, color]   # differing size/colour => product variant, never a duplicate
      price_tolerance_pct: 5
    steps:
      - tool: load_table                                     # Load products
        args: {path: $params.catalog_path, required_columns: [sku, product_name]}
        output: products
      - tool: normalize_products                             # Normalize names/SKUs
        args: {rows: $data.products, attributes: [brand, color, size]}
        output: normalized
      - tool: compare_identifiers                            # Compare identifiers
        args: {rows: $data.normalized}
        output: sku_pairs
      - tool: compare_attributes                             # Compare product attributes
        args:
          rows: $data.normalized
          exclude_pairs: $data.sku_pairs
          weights: $settings.weights
          min_name_similarity: $settings.min_name_similarity
          possible_threshold: $settings.possible_threshold
          price_tolerance_pct: $settings.price_tolerance_pct
          variant_attributes: $settings.variant_attributes
        output: attr_pairs
      - tool: group_duplicates                               # Group likely duplicates
        args: {rows: $data.normalized, pairs: [$data.sku_pairs, $data.attr_pairs]}
        output: groups
      - tool: assign_confidence                              # Assign confidence
        args: {groups: $data.groups, high_threshold: $settings.high_threshold}
        output: scored
    report:
      title: Duplicate product groups
      vars: {groups: $data.scored, products: $data.products}
      computed: {n: len(groups), total: len(products)}
      summary: "{n} duplicate group(s) found among {total} catalogue products."
      tables:
        - title: Duplicate groups
          rows: $data.scored
          columns: [group, confidence, score, skus, products, matching_fields, reason]
          empty_message: No duplicates found.
      exports:
        - {rows: $data.scored, path: outputs/files/duplicate_groups.csv}
      notes: ["Definite = exact SKU match (after trimming/upper-casing). High/Medium = possible duplicates from attribute similarity.",
              "Products with a similar name but a different size or colour are treated as variants, not duplicates."]

  # ---------------------------------------------------------------------------
  WF007:
    keywords: [campaign, brief, marketing, promotion, launch, collection]
    params:
      campaign_goal:
        description: The campaign goal/objective, only if the user states it
        pattern: '\bgoal(?:\s+is)?\s*[:\-]?\s*(?:to\s+)?([^,.;\n]+?)(?=\s*(?:[,.;\n]|\s(?:from|running|between)\s|$))'
      start_date:
        description: Campaign start date (YYYY-MM-DD), only if stated
        pattern: '(\d{4}-\d{2}-\d{2})'
      end_date:
        description: Campaign end date (YYYY-MM-DD), only if stated
        pattern: '\d{4}-\d{2}-\d{2}.*?(\d{4}-\d{2}-\d{2})'
      product_list: {type: array, description: "Product names or SKUs to feature, only if listed", pattern: '\b(SKU-\d+(?:\s*(?:,|and)\s*SKU-\d+)*)'}
      collection: {description: "Collection name if explicitly named (e.g. \"Autumn 2026\")", pattern: '\b((?:spring|summer|autumn|fall|winter|holiday|core)(?:\s+\d{4})?)\s+(?:collection|range|line)\b'}
      target_audience:
        description: Target audience, only if stated
        pattern: '\b(?:audience|targeting|target)(?:\s+is)?\s*[:\-]?\s*([^,.;\n]+)'
      promotion:
        description: Promotion/offer, only if stated (e.g. 15% off)
        pattern: '(?:promotion|promo|offer)(?:\s+is)?\s*[:\-]?\s*([^,;\n]+)|(\d+%\s*off[^,;\n]*)'
    settings:
      products_path: data/products.csv
      new_collection: Autumn 2026
    steps:
      - tool: validate_params                                # Validate inputs
        args:
          required: [campaign_goal, start_date, end_date]
          soft: [target_audience, promotion]
          date_fields: [start_date, end_date]
          date_order: [start_date, end_date]
          labels: {campaign_goal: campaign goal, start_date: start date, end_date: end date}
          question: "Please provide the campaign goal and the start/end dates (e.g. 'Goal: drive launch sales, 2026-11-01 to 2026-11-30') and I'll generate the brief."
        output: validation
      - tool: llm_generate                                   # Identify campaign objective
        args:
          task: Identify the campaign objective type and primary KPI from the goal
          inputs: {campaign_goal: $params.campaign_goal}
          fields:
            objective_type: {description: "one of awareness | acquisition | conversion | retention"}
            objective: {description: "One-sentence SMART-style objective restating the goal", max_chars: 200}
            primary_kpi: {description: "Primary KPI to measure"}
          fallback: campaign_objective
        output: objective
      - tool: select_campaign_products                       # Summarize products
        args:
          path: $settings.products_path
          product_list: $params.product_list
          collection: $params.collection
          request: $request
          new_collection: $settings.new_collection
        output: products
      - tool: llm_generate                                   # Create messaging
        args:
          task: Create campaign messaging
          inputs: {collection: $data.products.collection, products: $data.products.products,
                   target_audience: $params.target_audience, promotion: $params.promotion, objective: $data.objective}
          fields:
            key_message: {description: "Core message", max_chars: 220}
            tagline: {description: "Short tagline", max_chars: 70}
            supporting_points: {description: "3 bullet points (list of strings)"}
          fallback: campaign_messaging
        output: messaging
      - tool: llm_generate                                   # Create channel recommendations
        args:
          task: Recommend 3-5 marketing channels with a short rationale each
          inputs: {objective: $data.objective, target_audience: $params.target_audience,
                   promotion: $params.promotion, products: $data.products.categories}
          fields: {channel_recommendations: {description: "List of strings 'Channel (rationale)'"}}
          fallback: campaign_channels
        output: channels
      - tool: build_campaign_plan                            # Create campaign checklist
        args: {start_date: $params.start_date, end_date: $params.end_date,
               channels: $data.channels.channel_recommendations, promotion: $params.promotion}
        output: plan
    report:
      title: Campaign brief
      vars: {goal: $params.campaign_goal, start: $params.start_date, end: $params.end_date, plan: $data.plan}
      summary: "Campaign brief for '{goal}' running {start} to {end}."
      sections:
        - {title: Objective, content: $data.objective}
        - {title: Target audience, content: $params.target_audience}
        - {title: Product summary, content: {collection: $data.products.collection, products: $data.products.count,
                                             categories: $data.products.categories, price range: $data.products.price_range}}
        - {title: Messaging, content: $data.messaging}
        - {title: Channels, content: $data.channels.channel_recommendations}
        - {title: Checklist, content: $data.plan.checklist}
        - {title: Missing inputs (marked TBD), content: $data.validation.missing_soft}
      tables:
        - {title: Featured products, rows: $data.products.products, columns: [sku, product_name, category, price, material, color]}
        - {title: Timeline, rows: $data.plan.timeline, columns: [milestone, date]}

  # ---------------------------------------------------------------------------
  WF008:
    keywords: [keyword, keywords, seo, search intent, classify, map, pages]
    params:
      keywords_path: {description: "Keyword CSV file", default: data/keywords.csv, llm: false, pattern: '([\w./-]+keywords?[\w.-]*\.csv)'}
    settings:
      categories_path: data/categories.csv
      nav_pages: {login: /account/login, tracking: /pages/order-tracking, returns: /pages/returns-policy, store: /}
    steps:
      - tool: load_table                                     # Read keywords
        args: {path: $params.keywords_path, required_columns: [keyword]}
        output: keywords
      - tool: dedupe_rows                                    # Remove duplicates
        args: {rows: $data.keywords, key: norm_text(keyword)}
        output: unique
      - tool: llm_classify                                   # Classify search intent
        args:
          rows: $data.unique
          text_field: keyword
          label_field: intent
          labels: [informational, commercial, transactional, navigational]
          instructions: "informational = wants to learn; commercial = researching/comparing before buying; transactional = ready to buy/act; navigational = looking for a specific brand page or site area (Northline is our brand)."
          fallback: keyword_intent_rules
        output: classified
      - tool: map_keyword_categories                         # Map keywords to categories
        args:
          rows: $data.classified
          categories_path: $settings.categories_path
          nav_pages: $settings.nav_pages
        output: mapped
      - tool: compute_columns                                # Identify high-priority keywords
        args:
          rows: $data.mapped
          columns:
            priority: "'High' if (intent == 'transactional' and monthly_searches >= 1000) or (intent == 'commercial' and monthly_searches >= 2500) else ('Medium' if monthly_searches >= 1500 or intent in ['transactional', 'commercial'] else 'Low')"
          explain: "High = transactional ≥1,000 searches or commercial ≥2,500; Medium = ≥1,500 searches or buying intent; else Low"
        output: prioritized
      - tool: export_table                                   # Export results
        args: {rows: $data.prioritized, path: outputs/files/keyword_report.csv,
               columns: [keyword, monthly_searches, intent, category, priority, target_page, intent_reason]}
        output: export
    report:
      title: SEO keyword report
      vars: {raw: $data.keywords, rows: $data.prioritized}
      computed: {n_raw: len(raw), n: len(rows)}
      summary: "{n_raw} keywords read, {n} unique after de-duplication, classified and mapped to target pages."
      metrics: {Keywords read: n_raw, Unique keywords: n}
      tables:
        - title: High-priority keywords
          rows: $data.prioritized
          where: priority == 'High'
          sort_by: monthly_searches
          descending: true
          columns: [keyword, monthly_searches, intent, category, target_page]
        - title: All keywords
          rows: $data.prioritized
          sort_by: monthly_searches
          descending: true
          columns: [keyword, monthly_searches, intent, category, priority, target_page]
      notes: ["Full report exported to outputs/files/keyword_report.csv"]

  # ---------------------------------------------------------------------------
  WF009:
    keywords: [assign, task, employee, developer, best available, workload, allocate]
    params:
      task_description:
        description: What the task is, only if described
        pattern: 'task\s*[:\-]\s*([^\n]+)|(?:assign|allocate)\s+(?:a|an)\s+(?!(?:urgent|new|high)\b)(.+?)\s+task\b'
      task_id: {description: "Task ID like TASK-301, if given", pattern: '\b(TASK-\d+)\b'}
      required_skills: {type: array, description: "Skills explicitly required"}
      priority:
        description: Task priority if stated
        enum: [urgent, high, normal, low]
        keywords: {urgent: [urgent, asap, critical, immediately], high: [high priority, important], low: [low priority, whenever]}
      deadline: {description: "Deadline (YYYY-MM-DD) if stated", pattern: '(?:by|before|due)\s+(\d{4}-\d{2}-\d{2})'}
      role:
        description: Role requested (map synonyms like engineer/backend developer to Developer)
        enum: [Developer, Designer, Data Analyst, Marketing]
        keywords: {Developer: [developer, engineer, dev, programmer], Designer: [designer], Data Analyst: [analyst], Marketing: [marketer, marketing]}
      estimated_hours: {type: number, description: "Effort in hours if stated", pattern: '(\d+)\s*(?:h|hours)\b'}
    settings:
      employees_path: data/employees.csv
      tasks_path: data/tasks.csv
      weights: {skills: 0.6, capacity: 0.3, seniority: 0.1}
      min_skill_match: 0.67
      extra_skill_vocabulary: [kubernetes, go, docker, java, rust, terraform, react native, ios, android, machine learning, elasticsearch]
    steps:
      - tool: understand_task                                # Understand task requirements
        args:
          employees_path: $settings.employees_path
          tasks_path: $settings.tasks_path
          description: $params.task_description
          task_id: $params.task_id
          required_skills: $params.required_skills
          priority: $params.priority
          deadline: $params.deadline
          role: $params.role
          estimated_hours: $params.estimated_hours
          extra_skill_vocabulary: $settings.extra_skill_vocabulary
        output: task
      - tool: compare_skills                                 # Compare employee skills
        args: {employees_path: $settings.employees_path, task: $data.task}
        output: skill_scores
      - tool: check_workload                                 # Check current workload
        args: {candidates: $data.skill_scores, task: $data.task}
        output: capacity
      - tool: rank_candidates                                # Rank candidates
        args: {candidates: $data.capacity, task: $data.task, weights: $settings.weights}
        output: ranked
      - tool: select_employee                                # Select employee (or escalate)
        args: {ranked: $data.ranked, min_skill_match: $settings.min_skill_match}
        output: selection
      - tool: assignment_summary                             # Generate assignment summary
        args: {task: $data.task, selection: $data.selection}
        output: summary
    report:
      title: Task assignment
      vars: {s: $data.summary}
      summary: "Recommendation: {s[recommended]}"
      sections:
        - {title: Assignment summary, content: $data.summary}
      tables:
        - title: Candidate ranking
          rows: $data.selection.ranked
          columns: [rank, name, skill_match, matched_skills, available_hours, seniority, score, status]

  # ---------------------------------------------------------------------------
  WF010:
    keywords: [performance, failing, failure, workflows, logs, execution, slow, report, errors]
    params:
      logs_path:
        description: Execution log file. Use logs/execution_log.csv only if the user asks about the agent's own/live runs.
        default: data/workflow_execution_logs.csv
        enum: [data/workflow_execution_logs.csv, logs/execution_log.csv]
        keywords: {logs/execution_log.csv: [live, own runs, this agent, agent history]}
      failure_threshold:
        type: number
        description: Failure-rate threshold in percent, only if stated (default 10)
        default: 10
        pattern: '(\d+(?:\.\d+)?)\s*%'
    settings:
      avg_time_threshold_ms: 8000
      step_time_threshold_ms: 3000
    steps:
      - tool: load_table                                     # Load execution logs
        args: {path: $params.logs_path, required_columns: [run_id, workflow_id, step_name, status, duration_ms],
               missing_message: "No execution logs found yet - run a few requests first (the agent logs every run to logs/execution_log.csv)."}
        output: logs
      - tool: workflow_success_rates                         # Calculate success/failure rate
        args: {logs: $data.logs}
        output: rates
      - tool: average_execution_time                         # Calculate average execution time
        args: {logs: $data.logs, stats: $data.rates}
        output: stats
      - tool: frequent_errors                                # Identify frequent errors
        args: {logs: $data.logs, top_n: 6}
        output: errors
      - tool: slow_steps                                     # Identify slow steps
        args: {logs: $data.logs, threshold_ms: $settings.step_time_threshold_ms}
        output: slow
      - tool: performance_recommendations                    # Generate recommendations
        args:
          stats: $data.stats
          errors: $data.errors
          slow: $data.slow
          failure_threshold: $params.failure_threshold
          time_threshold_ms: $settings.avg_time_threshold_ms
        output: analysis
    report:
      title: Workflow performance report
      vars: {flagged: $data.analysis.flagged, stats: $data.stats, logs: $data.logs}
      computed: {n_flag: len(flagged), n_wf: len(stats)}
      summary: "{n_flag} of {n_wf} workflows are flagged (failure rate above threshold or slow). Sorted by failure rate below."
      tables:
        - title: Workflow metrics (sorted by failure rate)
          rows: $data.analysis.stats
          columns: [workflow_id, workflow_name, runs, failed_runs, failure_rate, success_rate, avg_run_ms, flag]
          headers: [ID, Workflow, Runs, Failed, Failure %, Success %, Avg ms, Flag]
        - {title: Most frequent errors, rows: $data.errors, columns: [workflow_id, step_name, error_message, occurrences, share_of_errors]}
        - {title: Slow steps, rows: $data.slow, columns: [workflow_id, step_name, avg_ms, executions], empty_message: No slow steps.}
      sections:
        - {title: Recommendations, content: $data.analysis.recommendations}
